<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán giá xe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .form-group select, .form-group input {
            transition: all 0.3s ease;
        }
        .form-group select:focus, .form-group input:focus {
            outline: none;
            border-color: #10B981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        .icon-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            <i class="fas fa-car mr-2"></i> Dự đoán giá xe
        </h1>
        <form id="predict-form" class="space-y-4">
            <div class="form-group">
                <label for="status" class="icon-label text-sm font-medium text-gray-700">
                    <i class="fas fa-info-circle"></i> Tình trạng xe
                </label>
                <select name="status" id="status" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500">
                    <option value="" disabled selected>Chọn tình trạng xe</option>
                    <option value="Xe cũ">Xe cũ</option>
                    <option value="Xe mới">Xe mới</option>
                </select>
            </div>
            <div class="form-group">
                <label for="origin" class="icon-label text-sm font-medium text-gray-700">
                    <i class="fas fa-globe"></i> Xuất xứ
                </label>
                <select name="origin" id="origin" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500">
                    <option value="" disabled selected>Chọn xuất xứ</option>
                    <option value="Trong nước">Trong nước</option>
                    <option value="Nhập khẩu">Nhập khẩu</option>
                    <option value="Other">Khác</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fuel_type" class="icon-label text-sm font-medium text-gray-700">
                    <i class="fas fa-gas-pump"></i> Loại nhiên liệu
                </label>
                <select name="fuel_type" id="fuel_type" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500">
                    <option value="" disabled selected>Chọn loại nhiên liệu</option>
                    <option value="xăng">Xăng</option>
                    <option value="dầu">Dầu</option>
                    <option value="khác">Khác</option>
                    <option value="điện">Điện</option>
                    <option value="hybrid">Hybrid</option>
                </select>
            </div>
            <div class="form-group">
                <label for="body_type" class="icon-label text-sm font-medium text-gray-700">
                    <i class="fas fa-car-side"></i> Kiểu thân xe
                </label>
                <select name="body_type" id="body_type" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500">
                    <option value="" disabled selected>Chọn kiểu thân xe</option>
                    <option value="Khác">Khác</option>
                    <option value="Crossover">Crossover</option>
                    <option value="SUV">SUV</option>
                    <option value="Sedan">Sedan</option>
                    <option value="Bán tải">Bán tải</option>
                    <option value="MPV">MPV</option>
                    <option value="Hatchback">Hatchback</option>
                    <option value="Xe tải">Xe tải</option>
                    <option value="Coupe">Coupe</option>
                    <option value="Convertible">Convertible</option>
                </select>
            </div>
            <div class="form-group">
                <label for="brand" class="icon-label text-sm font-medium text-gray-700">
                    <i class="fas fa-copyright"></i> Hãng xe
                </label>
                <select name="brand" id="brand" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500">
                    <option value="" disabled selected>Chọn hãng xe</option>
                    <option value="Mercedes">Mercedes</option>
                    <option value="Kia">Kia</option>
                    <option value="Ford">Ford</option>
                    <option value="Mazda">Mazda</option>
                    <option value="Mitsubishi">Mitsubishi</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Nissan">Nissan</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Suzuki">Suzuki</option>
                    <option value="VinFast">VinFast</option>
                    <option value="Chevrolet">Chevrolet</option>
                    <option value="Honda">Honda</option>
                    <option value="BMW">BMW</option>
                    <option value="Lexus">Lexus</option>
                    <option value="Peugeot">Peugeot</option>
                    <option value="Subaru">Subaru</option>
                    <option value="Audi">Audi</option>
                    <option value="Land">Land</option>
                    <option value="MG">MG</option>
                    <option value="BYD">BYD</option>
                    <option value="Mini">Mini</option>
                    <option value="Volvo">Volvo</option>
                    <option value="Volkswagen">Volkswagen</option>
                    <option value="Isuzu">Isuzu</option>
                    <option value="Teraco">Teraco</option>
                    <option value="Porsche">Porsche</option>
                    <option value="FAW">FAW</option>
                    <option value="Chrysler">Chrysler</option>
                    <option value="Daewoo">Daewoo</option>
                    <option value="Citroen">Citroen</option>
                    <option value="Omoda">Omoda</option>
                    <option value="Ssangyong">Ssangyong</option>
                    <option value="Jaecoo">Jaecoo</option>
                    <option value="LandRover">LandRover</option>
                    <option value="Acura">Acura</option>
                    <option value="Wuling">Wuling</option>
                    <option value="Jaguar">Jaguar</option>
                    <option value="GAC">GAC</option>
                    <option value="Skoda">Skoda</option>
                    <option value="Cadillac">Cadillac</option>
                    <option value="Gaz">Gaz</option>
                    <option value="Luxgen">Luxgen</option>
                </select>
            </div>
            <div class="form-group">
                <label for="age" class="icon-label text-sm font-medium text-gray-700">
                    <i class="fas fa-calendar-alt"></i> Tuổi xe (năm)
                </label>
                <input type="number" name="age" id="age" step="0.1" min="0" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500" placeholder="Nhập tuổi xe (ví dụ: 2.5)">
            </div>
            <div class="form-group">
                <label for="mileage" class="icon-label text-sm font-medium text-gray-700">
                    <i class="fas fa-tachometer-alt"></i> Số km đã đi
                </label>
                <input type="number" name="mileage" id="mileage" min="0" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-emerald-500" placeholder="Nhập số km (ví dụ: 45000)">
            </div>
            <button type="submit" class="w-full bg-emerald-500 text-white font-semibold py-2 px-4 rounded-md hover:bg-emerald-600 transition duration-300">
                <i class="fas fa-calculator mr-2"></i> Dự đoán giá
            </button>
        </form>
        <div id="result" class="mt-6 text-lg font-semibold text-gray-800 text-center"></div>
    </div>

    <script>
        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Đang dự đoán...';
            const formData = new FormData(e.target);
            
            // Debug: In dữ liệu form
            for (let [key, value] of formData.entries()) {
                console.log(`${key}: ${value}`);
            }
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.prediction) {
                    resultDiv.innerHTML = `Giá dự đoán: ${result.prediction.toLocaleString('vi-VN')} VND`;
                    resultDiv.classList.remove('text-red-500');
                    resultDiv.classList.add('text-green-600');
                } else {
                    resultDiv.innerHTML = `Lỗi: ${result.error}`;
                    resultDiv.classList.remove('text-green-600');
                    resultDiv.classList.add('text-red-500');
                }
            } catch (error) {
                resultDiv.innerHTML = `Lỗi: Không thể lấy kết quả dự đoán - ${error.message}`;
                resultDiv.classList.remove('text-green-600');
                resultDiv.classList.add('text-red-500');
            }
        });
    </script>
</body>
</html>
